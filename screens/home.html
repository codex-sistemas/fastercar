<app-column style="
        background-color: var(--color-background);
        color: var(--color-text);
        gap: 0;
        width: 100%;
        height: 100%;
    ">

    <!-- TOPO -->
    <app-row style="
            width: 100%;
            padding: 0.5rem;
            gap: 1rem;
            align-items: center;
        ">

        <!-- ABRIR MENU LATERAL -->
        <button onclick="APP.actions.openSidebar()" style="
                width: 3rem;
                height: 3rem;
                flex-shrink: 0;

                border: none;
                border-radius: 0.75rem;

                background-color: var(--color-primary);
                color: var(--color-background);

                font-size: 1.4rem;
            ">
            ☰
        </button>


        <!-- SALDO -->
        <app-column style="
                flex: 1;
                gap: 0;
                align-items: center;
                justify-content: center;
            ">

            <span style="
                    font-size: 0.8rem;
                    color: var(--color-secondary);
                ">
                Saldo
            </span>

            <strong style="
                    font-size: 1.4rem;
                    color: var(--color-primary);
                ">
                R$ 0,00
            </strong>

        </app-column>

        <app-spacer style="
                width: 3rem;
                height: 3rem;">

        </app-spacer>


    </app-row>


    <!-- MAPA -->
    <app-column style="
            flex: 1;
            width: 100%;

            background-color: #e5e5e5;

            justify-content: center;
            align-items: center;
        ">

        <span>
            MAPA
        </span>

    </app-column>


    <!-- BOTÕES INFERIORES -->
    <app-row style="
            width: 100%;
            padding: 0.5rem;

            justify-content: space-around;
            align-items: center;
            text-align: center;
            /* justify-content: space-between; */
        ">

        <!-- BOTÃO ESQUERDO -->
        <button onclick="APP.navigate('trips')" style="
                width: 3.5rem;
                height: 3.5rem;

                border: none;
                border-radius: 50%;

                background-color: var(--color-primary);
                color: var(--color-background);

                font-size: 1.3rem;
                display: none;
            ">
            ↕
        </button>

        <!-- CONECTAR -->
        <button onclick="APP.actions.toggleConnection()" style="

                border: none;
                border-radius: 0.75rem;

                padding: 0.8rem 1.2rem;

                background-color: var(--color-primary);
                color: var(--color-background);

                font-size: 2rem;
                font-weight: bold;
            ">
            Conectar
        </button>

        <!-- BOTÃO DIREITO -->
        <button onclick="APP.actions.centerMap()" style="
                width: 3.5rem;
                height: 3.5rem;

                border: none;
                border-radius: 50%;

                background-color: var(--color-primary);
                color: var(--color-background);

                font-size: 1.3rem;
                display: none;
            ">
            ⌖
        </button>

    </app-row>

</app-column>
