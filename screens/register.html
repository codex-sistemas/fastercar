<app-column class="scroll-y-on" style="
     background-color: var(--color-background);
     color: var(--color-text);
     padding: 2rem;
     gap: 0.5rem;
 ">

    <app-row style="
        justify-content: center;
        max-height: 8rem;
    ">

        <img src="./assets/images/logo.png" style="
            width: 40%;
            object-fit: contain;
        ">

    </app-row>


    <app-row style="
        max-height: 4rem;
        justify-content: center;
    ">

        <h1 style="
            color: var(--color-primary);
            font-size: 3rem;
            margin: 0;
            text-align: center;
        ">
            Criar conta
        </h1>

    </app-row>


    <!-- Nome -->

    <app-row style="
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/profile.png" class="icon">

        <input id="name" type="text" placeholder="Nome completo" autocomplete="name">

    </app-row>

    <!-- Data de Nascimento -->

    <app-row style="
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/calendar.png" class="icon">
        <input id="birth-date" type="text" placeholder="DD/MM/AAAA" inputmode="numeric" maxlength="10"
            oninput="APP.actions.maskDate(this)">

    </app-row>


    <!-- CPF -->

    <app-row style="
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/cpf.png" class="icon">

        <input id="cpf" type="text" placeholder="CPF" inputmode="numeric" maxlength="14"
            oninput="APP.actions.maskCPF(this)">

    </app-row>


    <!-- Telefone -->

    <app-row style="
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/phone.png" class="icon">

        <input id="phone" type="tel" placeholder="Telefone" inputmode="tel" autocomplete="tel">

    </app-row>


    <!-- Gênero -->

    <app-row style="
        flex-direction: row;
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/gender.png" class="icon">

        <select id="gender">

            <option value="" selected disabled>
                Gênero
            </option>
            <option value="masculino">
                Masculino
            </option>
            <option value="feminino">
                Feminino
            </option>
        </select>

    </app-row>


    <!-- CNH EAR -->

    <app-row style="
        flex-direction: row;
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/cnh.png" class="icon">
        <button type="button" id="ButtonCNHe" style="
            background-color: var(--color-secondary);
            color: var(--color-background);
            border: none;
            border-radius: 0.5rem;
            flex-direction: column;
            max-width: 100%;
            width: 100%;" onclick="document.getElementById('cnh-pdf').click()">
            PDF da CNH-e com EAR
        </button>
        <input id="cnh-pdf" type="file" accept=".pdf" style="display: none;" onchange="APP.actions.showNameFile(this)">

    </app-row>
    <app-row style="justify-content: center;">
        <p style="font-size: 1rem; align-items: center;">Exporte sua CNH digital com EAR e no botão acima.</p>
    </app-row>


    <!-- Chave Pix -->

    <app-row style="
        flex-direction: row;
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/pix.png" class="icon">

        <input id="key-pix" type="text" placeholder="Chave Pix">

    </app-row>


    <!-- Foto -->

    <app-row style="
        align-items: center;
        justify-content: center;
    ">
        <button type="button" style="
            background-color: var(--color-secondary);
            color: var(--color-background);
            border: none;
            border-radius: 0.5rem;
            flex-direction: column;" onclick="document.getElementById('photo-input').click()">
            <img class="icon" id="photo-profile" src="./assets/images/profile.png" style="
                width: 7.5rem;
                height: 7.5rem;
                object-fit: cover;
                border-radius: 1rem;
                background-color: var(--color-secondary);
                margin: auto; ">
            Foto do Rosto
        </button>
        <input id="photo-input" type="file" accept="image/*" style="display: none;">
    </app-row>

    <!-- Criar conta -->

    <app-row style="
        max-height: 4rem;
        justify-content: center;
        border-top: 0.1rem solid var(--color-primary);
    ">

        <button style="
            background-color: var(--color-primary);
            color: var(--color-background);
            border: none;
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 2rem;
            margin-top: 0.5rem;
        " onclick="APP.actions.register()">
            Registrar
        </button>

    </app-row>
</app-column>
