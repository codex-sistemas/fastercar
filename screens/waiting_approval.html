<app-column style="
    background-color: var(--color-background);
    color: var(--color-text);
    padding: 2rem;
    gap: 1rem;
    align-items: center;
    justify-content: center;
    text-align: center;
">

    <!-- Logo -->

    <app-row style="
        justify-content: center;
    ">

        <img src="./assets/images/logo.png" style="
            width: 4rem;
            object-fit: contain;
        ">

    </app-row>


    <!-- Ícone -->

    <app-row style="
        justify-content: center;
        max-height: 8rem;
    ">

        <img src="./assets/images/hourglass.png" style="
            width: 6rem;
            height: 6rem;
            object-fit: contain;
            background-color: var(--color-primary);
            border-radius: 1.5rem;
            padding: 0.5rem;
        ">

    </app-row>


    <!-- Título -->

    <app-row style="
        justify-content: center;
        max-height: 5rem;
    ">

        <h1 style="
            color: var(--color-primary);
            font-size: 2.5rem;
            margin: 0;
        ">
            Aguardando avaliação
        </h1>

    </app-row>


    <!-- Mensagem -->

    <app-column style="
        width: 100%;
        max-width: 35rem;
        gap: 1rem;
        align-items: center;
    ">

        <p style="
            font-size: 1.2rem;
            margin: 0;
            line-height: 1.5;
        ">
            Seus dados e documentos foram enviados com sucesso.
        </p>

        <p style="
            font-size: 1.1rem;
            margin: 0;
            line-height: 1.5;
        ">
            Nossa equipe irá avaliar seu cadastro em até
            <strong>3 dias úteis</strong>.
        </p>

        <p style="
            font-size: 1rem;
            margin: 0;
            line-height: 1.5;
            opacity: 0.8;
        ">
            Durante esse período, aguarde a análise dos seus documentos.
        </p>

    </app-column>


    <!-- Status -->

    <app-row style="
        width: 100%;
        max-width: 30rem;
        justify-content: center;
        padding: 1rem;
        border: 0.1rem solid var(--color-primary);
        border-radius: 0.75rem;
        box-sizing: border-box;
    ">

        <app-column style="
            gap: 0.25rem;
            align-items: center;
        ">

            <strong style="
                font-size: 1.1rem;
                color: var(--color-primary);
            ">
                Cadastro em análise
            </strong>

            <span style="
                font-size: 0.9rem;
                opacity: 0.8;
            ">
                Você será informado quando houver uma atualização.
            </span>

        </app-column>

    </app-row>

</app-column>
