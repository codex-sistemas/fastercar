<app-column class="scroll-y-on" style="
     background-color: var(--color-background);
     color: var(--color-text);
     padding: 2rem;
     gap: 0.5rem;
 ">

    <app-row style="
        justify-content: center;
        max-height: 8rem;
    ">

        <img src="./assets/images/logo.png" style="
            width: 40%;
            object-fit: contain;
        ">

    </app-row>


    <app-row style="
        max-height: 4rem;
        justify-content: center;
    ">

        <h1 style="
            color: var(--color-primary);
            font-size: 3rem;
            margin: 0;
            text-align: center;
        ">
            Registrar veículo
        </h1>

    </app-row>


    <!-- Marca -->

    <app-row style="
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/car.png" class="icon">

        <input id="vehicle-brand" type="text" placeholder="Marca" autocomplete="off">

    </app-row>


    <!-- Modelo -->

    <app-row style="
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/steering_wheel.png" class="icon">

        <input id="vehicle-model" type="text" placeholder="Modelo" autocomplete="off">

    </app-row>


    <!-- Placa -->

    <app-row style="
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/key.png" class="icon">

        <input id="vehicle-plate" type="text" placeholder="Placa" inputmode="text" maxlength="7" autocomplete="off"
            oninput="APP.actions.maskPlate(this)">

    </app-row>


    <!-- Ano -->

    <app-row style="
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/calendar.png" class="icon">

        <input id="vehicle-year" type="text" placeholder="Ano" inputmode="numeric" maxlength="4" autocomplete="off"
            oninput="APP.actions.maskYear(this)">

    </app-row>


    <!-- CRLV-e -->

    <app-row style="
        flex-direction: row;
        max-height: 5rem;
        gap: 0.5rem;
    ">

        <img src="./assets/images/document.png" class="icon">

        <button type="button" id="ButtonCRLVe" style="
                background-color: var(--color-secondary);
                color: var(--color-background);
                border: none;
                border-radius: 0.5rem;
                flex-direction: column;
                max-width: 100%;
                width: 100%;
            " onclick="document.getElementById('crlv-pdf').click()">
            PDF do CRLV-e
        </button>

        <input id="crlv-pdf" type="file" accept=".pdf" style="display: none;" onchange="APP.actions.showNameFile(this)">

    </app-row>

    <app-row style="
        justify-content: center;
    ">

        <p style="
            font-size: 1rem;
            align-items: center;
            text-align: center;
        ">
            Exporte seu CRLV digital em PDF e envie acima.
        </p>

    </app-row>


    <!-- Registrar -->

    <app-row style="
        max-height: 4rem;
        justify-content: center;
        border-top: 0.1rem solid var(--color-primary);
    ">

        <button style="
                background-color: var(--color-primary);
                color: var(--color-background);
                border: none;
                padding: 1rem;
                border-radius: 0.5rem;
                font-size: 2rem;
                margin-top: 0.5rem;
            " onclick="APP.actions.registerVehicle()">
            Registrar veículo
        </button>

    </app-row>

</app-column>
